<!DOCTYPE html>
<html lang="es"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6366f1">
  <title>FIXORA - Técnicos</title><link rel="icon" href="img/logologin.png"><link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/animations.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/technicians.css"><link rel="stylesheet" href="css/responsive.css">
</head><body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar"><div class="sidebar-header"><div class="sidebar-logo"><img src="img/logo.png" alt="FIXORA"></div></div><nav class="sidebar-nav"></nav><div class="sidebar-footer"><button class="btn btn-ghost btn-block" onclick="Auth.signOut()"><span class="sidebar-footer-text">Cerrar sesión</span></button></div><button class="sidebar-toggle" id="sidebar-toggle" aria-label="Contraer menú">‹</button></aside><div class="sidebar-backdrop" id="sidebar-backdrop"></div>
  <main class="main-content"><header class="navbar"><div class="navbar-left"><button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Abrir menú"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button><div class="breadcrumb"><a href="dashboard.html" class="breadcrumb-item">Dashboard</a><span>›</span><span class="breadcrumb-item active">Técnicos</span></div></div><button class="theme-toggle" onclick="App.toggleTheme()" aria-label="Cambiar tema">◐</button></header>
  <div class="page-content page-enter technician-admin-page">
    <div class="page-header technician-page-header"><div><h1 class="page-title">Equipo técnico</h1><p class="page-subtitle">Personal, accesos y asignación de reparaciones</p></div><button class="btn btn-primary technician-primary-action" id="new-technician">+ Nuevo técnico</button></div>
    <div class="technician-stats" id="technician-stats" aria-live="polite"></div>
    <div class="technician-tabs" role="tablist"><button class="technician-tab active" data-panel="people" role="tab">Técnicos</button><button class="technician-tab" data-panel="repairs" role="tab">Reparaciones <span id="unassigned-badge"></span></button></div>
    <section id="people-panel">
      <div class="card technician-toolbar"><label class="technician-search"><span class="sr-only">Buscar técnicos</span><input class="form-input" id="technician-search" type="search" placeholder="Buscar nombre, documento, correo o teléfono"></label><select class="form-select" id="technician-status" aria-label="Filtrar por estado"><option value="all">Todos los estados</option><option value="active">Activos</option><option value="inactive">Inactivos</option></select><select class="form-select" id="technician-specialty" aria-label="Filtrar por especialidad"><option value="all">Todas las especialidades</option></select></div>
      <div class="technician-table-card card"><div class="table-container"><table class="table technician-table"><thead><tr><th>Técnico</th><th>Contacto</th><th>Especialidad</th><th>Trabajos</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="technician-table-body"></tbody></table></div><div class="technician-mobile-list" id="technician-mobile-list"></div><div id="technician-empty"></div></div>
    </section>
    <section id="repairs-panel" hidden>
      <div class="card technician-toolbar repair-toolbar"><input class="form-input" id="repair-search" type="search" placeholder="Buscar ingreso, equipo o cliente"><select class="form-select" id="repair-technician"><option value="all">Todos los técnicos</option><option value="unassigned">Sin técnico</option></select><select class="form-select" id="repair-status"><option value="all">Todos los estados</option><option value="received">Recibido</option><option value="assigned">Asignado</option><option value="diagnosing">En diagnóstico</option><option value="repairing">En reparación</option><option value="ready">Terminado</option></select></div>
      <div class="repair-admin-grid" id="repair-admin-grid"></div>
    </section>
  </div></main>
</div>
<script src="js/app-config.js"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/utils.js"></script><script src="js/components.js"></script><script src="js/storage.js"></script><script src="js/auth.js"></script><script src="js/dashboard.js"></script><script src="js/technicians-admin.js"></script><script src="js/app.js"></script>
<script>document.addEventListener('DOMContentLoaded',async()=>{if(!await Auth.guard('admin'))return;App.init();App.setupSidebar();Dashboard.renderSidebar();TechniciansAdmin.init();});</script>
</body></html>
