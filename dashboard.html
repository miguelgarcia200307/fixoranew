<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#6366f1">
  <title>FIXORA - Dashboard</title>
  <link rel="icon" type="image/png" href="img/logologin.png">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <img src="img/logo.png" alt="FIXORA">
        </div>
      </div>
      <nav class="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <button class="btn btn-ghost btn-block" onclick="Auth.signOut()" style="justify-content:flex-start;gap:var(--space-3)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span class="sidebar-footer-text">Cerrar Sesión</span>
        </button>
      </div>
      <button class="sidebar-toggle" id="sidebar-toggle">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
    </aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <!-- Main -->
    <main class="main-content">
      <header class="navbar">
        <div class="navbar-left">
          <button class="mobile-menu-btn" id="mobile-menu-btn">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <h1 class="navbar-title">Dashboard</h1>
        </div>
        <div class="navbar-right">
          <button class="btn btn-secondary btn-sm" id="global-search-btn" data-tooltip="Buscar (Ctrl+K)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <span class="hidden-mobile">Buscar</span>
          </button>
          <button class="theme-toggle" onclick="App.toggleTheme()" data-tooltip="Cambiar tema">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
        </div>
      </header>

      <div class="page-content page-enter">
        <div class="page-header">
          <div>
            <h2 class="page-title">Bienvenido a FIXORA</h2>
            <p class="page-subtitle">Resumen de tu negocio</p>
          </div>
          <a href="factura.html" class="btn btn-primary">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Nuevo Documento
          </a>
        </div>

        <!-- Stats -->
        <div class="dashboard-stats" id="stats-grid">
          <div class="stat-card"><div class="skeleton skeleton-card"></div></div>
          <div class="stat-card"><div class="skeleton skeleton-card"></div></div>
          <div class="stat-card"><div class="skeleton skeleton-card"></div></div>
          <div class="stat-card"><div class="skeleton skeleton-card"></div></div>
        </div>

        <!-- Quick Actions -->
        <div style="margin-bottom:var(--space-6)">
          <h3 class="font-semibold text-primary" style="margin-bottom:var(--space-4)">Accesos Rápidos</h3>
          <div class="quick-actions" id="quick-actions"></div>
        </div>

        <!-- Bottom Grid -->
        <div class="dashboard-bottom">
          <div class="card">
            <div class="card-header">
              <h3 class="card-title">Documentos Recientes</h3>
              <a href="historial.html" class="btn btn-ghost btn-sm">Ver todo</a>
            </div>
            <div class="recent-list" id="recent-documents">
              <div class="skeleton skeleton-text"></div>
              <div class="skeleton skeleton-text" style="width:70%"></div>
              <div class="skeleton skeleton-text" style="width:85%"></div>
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <h3 class="card-title">Actividad Reciente</h3>
            </div>
            <div id="activity-log" class="recent-list">
              <div class="skeleton skeleton-text"></div>
              <div class="skeleton skeleton-text" style="width:60%"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Global Search Overlay -->
  <div class="global-search-overlay" id="global-search-overlay">
    <div class="global-search-modal">
      <div class="global-search-input-wrapper">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" class="global-search-input" placeholder="Buscar documentos, clientes..." autofocus>
        <kbd class="global-search-shortcut">ESC</kbd>
      </div>
      <div class="global-search-results"></div>
      <div class="global-search-footer">
        <span><kbd class="global-search-shortcut">↑↓</kbd> Navegar</span>
        <span><kbd class="global-search-shortcut">Enter</kbd> Seleccionar</span>
        <span><kbd class="global-search-shortcut">ESC</kbd> Cerrar</span>
      </div>
    </div>
  </div>

  <script src="js/app-config.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/components.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/search.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!await Auth.guard()) return;
      App.init();
      App.setupSidebar();
      Dashboard.init();
      GlobalSearch.init();
    });
  </script>
</body>
</html>
