<!DOCTYPE html>
<html lang="es"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6366f1"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
  <title>FIXORA - Panel técnico</title><link rel="icon" href="img/logologin.png"><link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/animations.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/technicians.css"><link rel="stylesheet" href="css/responsive.css">
</head><body class="technician-portal-body">
<div class="technician-shell">
  <header class="technician-topbar"><div class="technician-brand"><img src="img/logologin.png" alt=""><div><strong>FIXORA</strong><span>Panel técnico</span></div></div><div class="technician-top-actions"><button class="tech-icon-button" id="notification-button" aria-label="Notificaciones"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 00-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg><span id="notification-count" hidden></span></button><button class="tech-icon-button" onclick="App.toggleTheme()" aria-label="Cambiar tema">◐</button><button class="tech-avatar-button" id="profile-button" aria-label="Abrir perfil"><span id="tech-avatar">T</span></button></div></header>
  <main class="technician-main">
    <section class="tech-view active" id="view-home"><div class="tech-welcome"><div><p id="welcome-time">Hola</p><h1 id="technician-name">Técnico</h1></div><span id="current-date"></span></div><div class="tech-stat-grid" id="tech-stats"></div><div class="tech-section-heading"><div><h2>Trabajos recientes</h2><p>Continúa donde quedaste</p></div><button class="text-button" data-go="repairs">Ver todos</button></div><div class="tech-repair-list" id="recent-repairs"></div></section>
    <section class="tech-view" id="view-repairs"><div class="tech-page-title"><div><h1>Mis reparaciones</h1><p id="repair-result-count">Cargando…</p></div></div><div class="tech-mobile-filters"><label class="tech-search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="tech-repair-search" type="search" placeholder="Buscar ingreso o equipo"></label><select id="tech-repair-status" class="form-select"><option value="all">Todos</option><option value="assigned">Asignados</option><option value="diagnosing">Diagnóstico</option><option value="awaiting_authorization">Autorización</option><option value="awaiting_part">Esperando repuesto</option><option value="repairing">Reparación</option><option value="testing">Pruebas</option><option value="ready">Terminados</option></select></div><div class="tech-repair-list" id="all-repairs"></div></section>
    <section class="tech-view" id="view-notifications"><div class="tech-page-title"><div><h1>Notificaciones</h1><p>Novedades de tus trabajos</p></div><button class="text-button" id="read-all">Leer todas</button></div><div class="tech-notification-list" id="notification-list"></div></section>
    <section class="tech-view" id="view-profile"><div class="tech-page-title"><div><h1>Mi perfil</h1><p>Información de acceso</p></div></div><div class="card tech-profile-card" id="tech-profile-card"></div><button class="btn btn-secondary btn-block tech-signout" onclick="Auth.signOut()">Cerrar sesión</button></section>
  </main>
  <nav class="technician-bottom-nav" aria-label="Navegación principal"><button class="active" data-view="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-7H9v7H4a1 1 0 01-1-1z"/></svg><span>Inicio</span></button><button data-view="repairs"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="15" rx="2"/><path d="M8 22h8M12 19v3"/></svg><span>Reparaciones</span></button><button data-view="notifications"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 00-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/></svg><span>Avisos</span></button><button data-view="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg><span>Perfil</span></button></nav>
</div>
<script src="js/app-config.js"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/utils.js"></script><script src="js/components.js"></script><script src="js/storage.js"></script><script src="js/auth.js"></script><script src="js/repair-status-service.js?v=3"></script><script src="js/technician-portal.js"></script><script src="js/app.js"></script>
<script>document.addEventListener('DOMContentLoaded',async()=>{if(!await Auth.guard('technician'))return;App.init();TechnicianPortal.init();});</script>
</body></html>
