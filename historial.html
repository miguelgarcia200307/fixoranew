<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#6366f1">
  <title>FIXORA - Historial</title>
  <link rel="icon" type="image/png" href="img/logologin.png">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo"><img src="img/logo.png" alt="FIXORA"></div>
      </div>
      <nav class="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <button class="btn btn-ghost btn-block" onclick="Auth.signOut()" style="justify-content:flex-start;gap:var(--space-3)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span class="sidebar-footer-text">Cerrar Sesión</span>
        </button>
      </div>
      <button class="sidebar-toggle" id="sidebar-toggle"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>
    </aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <main class="main-content">
      <header class="navbar">
        <div class="navbar-left">
          <button class="mobile-menu-btn" id="mobile-menu-btn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
          <h1 class="navbar-title">Historial</h1>
        </div>
        <div class="navbar-right">
          <button class="theme-toggle" onclick="App.toggleTheme()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
        </div>
      </header>
      <div class="page-content page-enter">
        <div class="page-header">
          <div>
            <h2 class="page-title">Historial de Documentos</h2>
            <p class="page-subtitle">Gestiona todas tus facturas y cotizaciones</p>
          </div>
          <a href="factura.html" class="btn btn-primary">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Nuevo Documento
          </a>
        </div>

        <!-- Stats -->
        <div class="history-stats" id="history-stats"></div>

        <!-- Filters -->
        <div class="history-filters">
          <div class="tabs" style="flex:1">
            <button class="tab active" data-filter="all">Todos</button>
            <button class="tab" data-filter="invoice">Facturas</button>
            <button class="tab" data-filter="quote">Cotizaciones</button>
          </div>
          <select class="form-select" id="status-filter" style="width:160px">
            <option value="all">Todos los estados</option>
            <option value="draft">Borrador</option>
            <option value="sent">Enviado</option>
            <option value="paid">Pagado</option>
            <option value="cancelled">Anulado</option>
          </select>
          <div class="search-bar" style="max-width:300px">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" class="form-input" id="history-search" placeholder="Buscar...">
          </div>
        </div>

        <!-- Table -->
        <div id="history-table-container">
          <div class="skeleton skeleton-card" style="height:300px"></div>
        </div>

        <!-- Pagination -->
        <div id="history-pagination" class="mt-6"></div>
      </div>
    </main>
  </div>
  <script src="js/app-config.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/components.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/history.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!await Auth.guard()) return;
      App.init(); App.setupSidebar(); History.init();
    });
  </script>
</body>
</html>
